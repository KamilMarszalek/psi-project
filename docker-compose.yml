services:
  node0:
    build:
      dockerfile: dockerfile
    image: z11_token_ring
    container_name: z11_node0
    environment:
      SHOULD_START: "true"
      NODE_NAME: node0
      NODE_PORT: 5000
      PREV_NODE_NAME: node2
      PREV_NODE_PORT: 5000
      NEXT_NODE_NAME: node1
      NEXT_NODE_PORT: 5000
    networks: 
        z11_network:
            aliases: [node0]

  node1:
    build:
      dockerfile: dockerfile
    image: z11_token_ring
    container_name: z11_node1
    environment:
      NODE_NAME: node1
      NODE_PORT: 5000
      PREV_NODE_NAME: node0
      PREV_NODE_PORT: 5000
      NEXT_NODE_NAME: node2
      NEXT_NODE_PORT: 5000
    networks: 
        z11_network:
            aliases: [node1]

  node2:
    build:
      dockerfile: dockerfile
    image: z11_token_ring
    container_name: z11_node2
    environment:
      NODE_NAME: node2
      NODE_PORT: 5000
      NEXT_NODE_NAME: node0
      NEXT_NODE_PORT: 5000
      PREV_NODE_NAME: node1
      PREV_NODE_PORT: 5000
    networks:
        z11_network:
            aliases: [z11_node2]

networks:
  z11_network:
    external: true
